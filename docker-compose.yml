version: '3.8'

services:
  app:
    build: .
    container_name: edtech_bot
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: edtech_bot_db
    restart: always
    environment:
      POSTGRES_USER: edtech_user
      POSTGRES_PASSWORD: secret_pass
      POSTGRES_DB: edtech_bot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: edtech_bot_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
