version: '3.8'

services:
  app:
    build: .
    container_name: edtech_bot
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bot_network

  db:
    image: postgres:15-alpine
    container_name: edtech_bot_db
    restart: always
    environment:
      POSTGRES_USER: edtech_user
      POSTGRES_PASSWORD: secret_pass
      POSTGRES_DB: edtech_bot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edtech_user -d edtech_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: edtech_bot_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  pgdata:
